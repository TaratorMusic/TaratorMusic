<main>
	<div class="drag-area" style="display: flex; flex-direction: row; height: 10vw">
		<img id="taratorLogo" style="width: 10vw; height: 10vw" />
		<div id="song-name">TaratorMusic</div>
		<div id="minimise-button" class="no-drag">&#x2212;</div>
		<div id="close-button" class="no-drag">&times;</div>
	</div>

	<div id="content-area">
		<div id="thumbnail" class="drag-area"></div>
		<div id="lyrics-container"></div>
	</div>

	<div class="controls" style="display: flex; flex-direction: row; height: 10vw">
		<div id="previous-button" class="no-drag"></div>
		<div id="pauseplay-button" class="no-drag"></div>
		<div id="next-button" class="no-drag"></div>
		<div id="song-progress" class="no-drag">
			<span id="song-progress-text">00:00 / 00:00</span>
			<input type="range" id="pip-progress-slider" min="0" max="100" step="0.1" value="0" />
		</div>
		<div id="sound-wrap" class="no-drag">
			<div id="sound-button"></div>
			<div id="volume-container"><input type="range" id="volume-slider" min="0" max="100" value="100" /></div>
		</div>
		<div id="settings-button" class="no-drag"></div>
	</div>

	<div id="pip-settings">
		<div class="pip-settings-row">
			<label class="pip-settings-label" for="pip-disable-lyrics">
				<input type="checkbox" id="pip-disable-lyrics" />
				<span>Disable Lyrics</span>
			</label>
		</div>
		<div class="pip-settings-row">
			<label class="pip-settings-label" for="pip-translate-current-only">
				<input type="checkbox" id="pip-translate-current-only" />
				<span>Only translate the current line</span>
			</label>
		</div>
		<div class="pip-settings-row">
			<label class="pip-settings-label" for="pip-translation-select">Translation:</label>
			<select id="pip-translation-select"></select>
			<span id="pip-translation-warning" title="This translation has a different number of lines than the lyrics, so it cannot be shown.">!</span>
		</div>
	</div>
</main>

<style>
	* {
		margin: 0;
		padding: 0;
		color: white;
		text-align: center;
	}

	html,
	body {
		background: transparent;
	}

	main {
		background-color: #333;
		display: flex;
		flex-direction: column;
		height: 100vh;
		border-radius: 4px;
		overflow: hidden;
		position: relative;
	}

	.drag-area {
		-webkit-app-region: drag;
		flex: none;
	}

	.no-drag {
		-webkit-app-region: no-drag;
		cursor: pointer;
	}

	#song-name {
		width: 70vw;
		height: 10vw;
		overflow: hidden;
		white-space: nowrap;
		text-overflow: ellipsis;
		font-size: 5.6vw;
		line-height: 10vw;
		padding: 0 2vw;
	}

	#settings-button {
		width: 10vw;
		height: 10vw;
		background-size: 55%;
		background-repeat: no-repeat;
		background-position: center;
	}

	#settings-button:hover {
		filter: brightness(1.2);
	}

	#pip-settings {
		display: none;
		flex: none;
		flex-direction: column;
		gap: 1.4vw;
		padding: 1.6vw 4vw;
		background-color: rgba(0, 0, 0, 0.4);
		border-bottom: 1px solid rgba(255, 255, 255, 0.12);
		font-size: 4.8vw;
		text-align: left;
		opacity: 0;
		transition: opacity 0.12s ease;
	}

	#pip-settings.open {
		display: flex;
	}

	#pip-settings.open.shown {
		opacity: 1;
	}

	.pip-settings-row {
		display: flex;
		flex-direction: row;
		align-items: center;
		gap: 1.6vw;
	}

	.pip-settings-label {
		display: flex;
		flex-direction: row;
		align-items: center;
		gap: 1.2vw;
	}

	#pip-disable-lyrics {
		width: 4.4vw;
		height: 4.4vw;
		margin: 0;
		accent-color: #7aa2f7;
	}

	#pip-translation-select {
		font-size: 4.5vw;
		color: white;
		background-color: rgba(0, 0, 0, 0.6);
		border: 1px solid rgba(255, 255, 255, 0.25);
		border-radius: 0.6vw;
		padding: 0.4vw 0.8vw;
	}

	#pip-translation-warning {
		display: none;
		align-items: center;
		justify-content: center;
		width: 3.8vw;
		height: 3.8vw;
		border-radius: 50%;
		background-color: #b3261e;
		color: white !important;
		font-size: 2.8vw;
		font-weight: bold;
	}

	#content-area {
		flex: 1;
		display: flex;
		flex-direction: column;
		overflow: hidden;
		min-height: 0;
	}

	#thumbnail {
		width: 100vw;
		flex: none;
		aspect-ratio: 16 / 9;
		background-size: contain;
		background-position: center;
		background-repeat: no-repeat;
	}

	#thumbnail.hidden {
		display: none;
	}

	#close-button,
	#minimise-button {
		width: 10vw;
		height: 10vw;
		font-size: 10vw;
		display: flex;
		justify-content: center;
		align-items: center;
	}

	#previous-button,
	#pauseplay-button,
	#next-button {
		width: 10vw;
		height: 10vw;
		background-size: 60%;
		background-repeat: no-repeat;
		background-position: center;
	}

	#song-progress {
		width: 50vw;
		height: 10vw;
		display: flex;
		align-items: center;
		justify-content: center;
	}

	#pip-progress-slider {
		display: none;
		width: 46vw;
		margin: 0 2vw;
		accent-color: #7aa2f7;
		cursor: pointer;
	}

	#song-progress.show-slider #pip-progress-slider {
		display: block;
	}

	#song-progress.show-slider #song-progress-text {
		display: none;
	}

	#sound-wrap {
		width: 10vw;
		height: 10vw;
		position: relative;
	}

	#sound-button {
		width: 10vw;
		height: 10vw;
		background-size: 60%;
		background-repeat: no-repeat;
		background-position: center;
	}

	#volume-container {
		display: flex;
		visibility: hidden;
		opacity: 0;
		transform: translate(-50%, 0.5vw);
		transition: opacity 0.15s ease, transform 0.15s ease, visibility 0s 0.25s;
		position: absolute;
		z-index: 999;
		left: 50%;
		bottom: 9vw;
		max-height: calc(100vh - 12vw);
		background: rgba(0, 0, 0, 0.85);
		border-radius: 2vw;
		padding: 2vw 2vw;
		align-items: center;
		justify-content: center;
	}

	.controls {
		position: relative;
		z-index: 1000;
		flex: none;
	}

	main:has(#sound-wrap:hover) #thumbnail {
		-webkit-app-region: no-drag;
	}

	#sound-wrap:hover #volume-container {
		visibility: visible;
		opacity: 1;
		transform: translate(-50%, 0);
		transition: opacity 0.15s ease, transform 0.15s ease, visibility 0s 0s;
	}

	#volume-slider {
		width: 10vw;
		height: 38vw;
		max-height: calc(100vh - 17vw);
		writing-mode: vertical-lr;
		direction: rtl;
	}

	#lyrics-container {
		display: none;
		flex: 1;
		overflow-y: auto;
		overflow-x: hidden;
		padding: 0.5vw 4vw 0.5vw 1vw;
		font-size: 6vw;
		line-height: 1.4;
		text-align: left;
		white-space: pre-wrap;
		word-wrap: break-word;
		color: #666;
		min-height: 0;
		scrollbar-width: thin;
		scrollbar-color: #555 transparent;
	}

	#lyrics-container::-webkit-scrollbar {
		width: 0.8vw;
	}

	#lyrics-container::-webkit-scrollbar-track {
		background: transparent;
	}

	#lyrics-container::-webkit-scrollbar-thumb {
		background-color: #555;
		border-radius: 0.4vw;
	}

	#lyrics-container::-webkit-scrollbar-thumb:hover {
		background-color: #777;
	}

	#lyrics-container.visible {
		display: block;
	}

	#lyrics-container .lyric-line {
		transition: color 0.3s ease, transform 0.3s ease;
		padding: 0.2vw 0;
	}

	#lyrics-container .lyric-line.current {
		color: #e6c547;
		transform: scale(1.05);
		transform-origin: left center;
	}

	#lyrics-container .lyric-line.past {
		color: #999;
	}

	#lyrics-container .lyric-translation {
		font-size: 4.2vw;
		line-height: 1.3;
		color: #8a9bb5;
		padding: 0 0 0.4vw;
	}
</style>

<script>
	const { ipcRenderer } = require("electron");
	const path = require("path");

	let currentThumbnail;
	let assetsFolder;
	let showThumbnail = true;
	let showLyrics = false;
	let currentLyrics = "";
	let currentSyncedLyrics = [];
	let currentTranslationLines = [];
	let currentLyricIndex = -1;
	let keybinds = null;
	let currentSongName = "";
	let currentSongId = "";
	let currentSongLength = 0;
	let currentSongTime = 0;
	let isPipSeeking = false;
	let settingsOpen = false;
	let settingsRevealPending = false;
	let settingsRevealTimer = null;
	let pendingSettingsHeight = 0;
	let translateCurrentOnly = false;
	let currentVolume = 100;

	function loadImage(elementId, url) {
		try {
			const el = document.getElementById(elementId);
			if (el) el.style.backgroundImage = url;
		} catch (err) {
			console.error("Error loading image for " + elementId + ":", err);
		}
	}

	function renderLyrics(plainText, syncedLyrics, translationLines) {
		const container = document.getElementById("lyrics-container");
		container.innerHTML = "";

		const translations = translationLines || [];
		currentTranslationLines = translations;

		function appendLine(lineText, index, dataIndex) {
			const div = document.createElement("div");
			div.className = "lyric-line";
			if (dataIndex !== undefined) div.dataset.index = dataIndex;
			div.textContent = lineText || "\u00A0";
			container.appendChild(div);

			const translationText = translations[index];
			if (!translationText) return;
			const translation = document.createElement("div");
			translation.className = "lyric-translation";
			translation.dataset.lineIndex = index;
			translation.textContent = translationText;
			container.appendChild(translation);
		}

		if (syncedLyrics && syncedLyrics.length > 0) {
			currentSyncedLyrics = syncedLyrics;
			for (let i = 0; i < syncedLyrics.length; i++) appendLine(syncedLyrics[i].text, i, i);
		} else {
			currentSyncedLyrics = [];
			currentLyrics = plainText;
			const lines = plainText.split("\n");
			for (let i = 0; i < lines.length; i++) appendLine(lines[i], i);
		}
	}

	function updateTranslationVisibility() {
		const container = document.getElementById("lyrics-container");
		const translations = container.querySelectorAll(".lyric-translation");
		for (const element of translations) {
			const index = Number(element.dataset.lineIndex);
			element.style.display = !translateCurrentOnly || index == currentLyricIndex ? "block" : "none";
		}
	}

	function applyLineClasses(index) {
		const container = document.getElementById("lyrics-container");
		const lines = container.querySelectorAll(".lyric-line");

		for (let i = 0; i < lines.length; i++) {
			lines[i].classList.remove("current", "past");
			if (i == index) lines[i].classList.add("current");
			else if (i < index) lines[i].classList.add("past");
		}

		return lines;
	}

	function restoreLyricView() {
		if (currentLyricIndex < 0) return;
		const container = document.getElementById("lyrics-container");
		const lines = applyLineClasses(currentLyricIndex);
		if (currentLyricIndex >= lines.length) return;

		const line = lines[currentLyricIndex];
		const containerRect = container.getBoundingClientRect();
		const lineRect = line.getBoundingClientRect();
		const offset = lineRect.top - containerRect.top - containerRect.height / 2 + lineRect.height / 2;
		container.scrollTop += offset;
	}

	function scrollToLine(index) {
		if (index == currentLyricIndex) return;
		currentLyricIndex = index;

		const container = document.getElementById("lyrics-container");
		const lines = applyLineClasses(index);
		updateTranslationVisibility();

		if (index >= 0 && index < lines.length) {
			const line = lines[index];
			const containerRect = container.getBoundingClientRect();
			const lineRect = line.getBoundingClientRect();
			const offset = lineRect.top - containerRect.top - containerRect.height / 2 + lineRect.height / 2;
			container.scrollBy({ top: offset, behavior: "smooth" });
		} else if (index < 0) {
			container.scrollTo({ top: 0, behavior: "smooth" });
		}
	}

	function scrollProportional(progress) {
		const container = document.getElementById("lyrics-container");
		const maxScroll = container.scrollHeight - container.clientHeight;
		if (maxScroll > 0) {
			container.scrollTop = progress * maxScroll;
		}
	}

	function findCurrentLineIndex(time) {
		if (!currentSyncedLyrics || currentSyncedLyrics.length == 0) return -1;
		let index = -1;
		for (let i = 0; i < currentSyncedLyrics.length; i++) {
			if (currentSyncedLyrics[i].time <= time) {
				index = i;
			} else {
				break;
			}
		}
		return index;
	}

	function renderVolumeIcon() {
		if (!assetsFolder) return;
		const icon = currentVolume == 0 ? "mute.svg" : "sound.svg";
		loadImage("sound-button", `url("file://${path.join(assetsFolder, icon).replace(/\\/g, "/")}")`);
	}

	function setVolume(value) {
		const clamped = Math.max(0, Math.min(100, Number(value)));
		if (!Number.isFinite(clamped)) return;
		currentVolume = clamped;
		document.getElementById("volume-slider").value = clamped;
		renderVolumeIcon();
	}

	function revealSettingsPanel() {
		if (!settingsRevealPending) return;
		settingsRevealPending = false;
		const settingsEl = document.getElementById("pip-settings");
		settingsEl.classList.add("open");
		settingsEl.classList.add("shown");
	}

	function measureSettingsPanel() {
		const settingsEl = document.getElementById("pip-settings");
		settingsEl.classList.add("open");
		settingsEl.style.position = "absolute";
		settingsEl.style.left = "0";
		settingsEl.style.right = "0";
		settingsEl.style.bottom = "0";
		const height = settingsEl.getBoundingClientRect().height;
		settingsEl.style.position = "";
		settingsEl.style.left = "";
		settingsEl.style.right = "";
		settingsEl.style.bottom = "";
		settingsEl.classList.remove("open");
		return Number.isFinite(height) ? height : 0;
	}

	function setSettingsOpen(open) {
		const settingsEl = document.getElementById("pip-settings");
		clearTimeout(settingsRevealTimer);
		settingsRevealPending = false;

		if (open) {
			settingsOpen = true;
			pendingSettingsHeight = measureSettingsPanel();
			settingsEl.classList.remove("shown");
			settingsRevealPending = true;
			updateSize();
			settingsRevealTimer = setTimeout(revealSettingsPanel, 250);
			return;
		}

		settingsOpen = false;
		settingsEl.classList.remove("shown");
		settingsRevealTimer = setTimeout(() => {
			settingsEl.classList.remove("open");
			updateSize();
		}, 130);
	}

	function updateTranslationOptions(languages, selected, mismatch) {
		const select = document.getElementById("pip-translation-select");
		select.innerHTML = "";

		const noneOption = document.createElement("option");
		noneOption.value = "";
		noneOption.textContent = "None";
		select.appendChild(noneOption);

		for (const language of languages || []) {
			const option = document.createElement("option");
			option.value = language;
			option.textContent = language;
			select.appendChild(option);
		}

		select.value = selected || "";

		const warning = document.getElementById("pip-translation-warning");
		if (warning) warning.style.display = mismatch ? "inline-flex" : "none";
	}

	function updateSize() {
		const hasContent = currentSyncedLyrics.length > 0 || currentLyrics.trim().length > 0;
		const shouldExtend = showLyrics && hasContent;
		let height;
		if (shouldExtend) height = showThumbnail ? 732 : 375;
		else height = showThumbnail ? 244 : 100;

		const settingsEl = document.getElementById("pip-settings");
		if (settingsOpen && settingsEl) {
			const panelHeight = settingsRevealPending ? pendingSettingsHeight : settingsEl.getBoundingClientRect().height;
			if (Number.isFinite(panelHeight)) height += panelHeight;
		}

		ipcRenderer.send("miniplayer-resize", { height: Math.round(height) });

		const lyricsEl = document.getElementById("lyrics-container");
		shouldExtend ? lyricsEl.classList.add("visible") : lyricsEl.classList.remove("visible");
	}

	ipcRenderer.on("miniplayer-update", (_, data) => {
		try {
			if (data.keybinds != undefined) {
				keybinds = data.keybinds;
			}
			if (data.assetsFolder != undefined && data.assetsFolder != assetsFolder) {
				assetsFolder = data.assetsFolder;
				document.getElementById("taratorLogo").src = "file://" + path.join(assetsFolder, "tarator16_icon.png").replace(/\\/g, "/");
				loadImage("previous-button", `url("file://${path.join(assetsFolder, "previous.svg").replace(/\\/g, "/")}")`);
				loadImage("next-button", `url("file://${path.join(assetsFolder, "next.svg").replace(/\\/g, "/")}")`);
				loadImage("pauseplay-button", `url("file://${path.join(assetsFolder, "play.svg").replace(/\\/g, "/")}")`);
				loadImage("settings-button", `url("file://${path.join(assetsFolder, "settings.svg").replace(/\\/g, "/")}")`);
				renderVolumeIcon();
			}
			if (data.volume != undefined) setVolume(data.volume);

			if (data.songName != undefined) {
				const songChanged = data.songName != currentSongName;
				currentSongName = data.songName;
				document.getElementById("song-name").innerText = data.songName;
				if (songChanged) document.getElementById("lyrics-container").scrollTop = 0;
			}
			if (data.progress != undefined) document.getElementById("song-progress-text").innerText = data.progress;
			if (data.songLength != undefined) currentSongLength = data.songLength;
			if (data.songTime != undefined) currentSongTime = data.songTime;
			if (!isPipSeeking && currentSongLength > 0) progressSlider.value = String((currentSongTime / currentSongLength) * 100);
			if (data.isPlaying != undefined && assetsFolder) {
				const icon = data.isPlaying ? "pause.svg" : "play.svg";
				loadImage("pauseplay-button", `url("file://${path.join(assetsFolder, icon).replace(/\\/g, "/")}")`);
			}
			if (data.thumbnail != undefined && data.thumbnail != currentThumbnail) {
				currentThumbnail = data.thumbnail;
				const url = currentThumbnail.startsWith("http") ? `url("${currentThumbnail}")` : `url("file://${currentThumbnail.replace(/\\/g, "/")}")`;
				loadImage("thumbnail", url);
			}
			if (data.lyrics != undefined || data.syncedLyrics != undefined || data.translationLines != undefined) {
				const songChanged = data.songId != undefined && data.songId != currentSongId;
				if (data.songId != undefined) currentSongId = data.songId;
				currentLyrics = data.lyrics != undefined ? data.lyrics : currentLyrics;
				currentSyncedLyrics = data.syncedLyrics || [];
				currentTranslationLines = data.translationLines || [];
				renderLyrics(currentLyrics, currentSyncedLyrics, currentTranslationLines);
				updateTranslationOptions(data.translationLanguages, data.translationLanguage, data.translationMismatch);
				translateCurrentOnly = data.translateCurrentOnly === true;
				document.getElementById("pip-translate-current-only").checked = translateCurrentOnly;
				if (songChanged) {
					currentLyricIndex = -1;
					document.getElementById("lyrics-container").scrollTop = 0;
				} else {
					restoreLyricView();
				}
				updateTranslationVisibility();
				updateSize();
			}
			if (data.songProgress != undefined && showLyrics && (currentSyncedLyrics.length > 0 || currentLyrics.trim().length > 0)) {
				if (currentSyncedLyrics.length > 0 && data.songTime != undefined) {
					const index = findCurrentLineIndex(data.songTime);
					scrollToLine(index);
				} else {
					scrollProportional(data.songProgress);
				}
			}
		} catch (err) {
			console.error("Error handling miniplayer update:", err);
		}
	});

	ipcRenderer.on("pip-settings-update", (_, data) => {
		try {
			if (data.pipShowThumbnail != undefined) {
				showThumbnail = data.pipShowThumbnail == 1;
				const thumbEl = document.getElementById("thumbnail");
				showThumbnail ? thumbEl.classList.remove("hidden") : thumbEl.classList.add("hidden");
			}
			if (data.pipShowLyrics != undefined) {
				showLyrics = data.pipShowLyrics == 1;
				document.getElementById("pip-disable-lyrics").checked = !showLyrics;
			}
			updateSize();
		} catch (err) {
			console.error("Error handling pip-settings-update:", err);
		}
	});

	window.addEventListener("resize", () => {
		revealSettingsPanel();
	});

	document.addEventListener("keydown", event => {
		if (!keybinds) return;
		const key = event.key;
		let action = null;

		if (key == keybinds.previous) action = "previous";
		else if (key == keybinds.playPause) action = "playPause";
		else if (key == keybinds.next) action = "next";
		else if (key == keybinds.rewind) action = "rewind";
		else if (key == keybinds.skip) action = "skip";
		else if (key == keybinds.autoplay) action = "autoplay";
		else if (key == keybinds.shuffle) action = "shuffle";
		else if (key == keybinds.mute) action = "mute";
		else if (key == keybinds.speed) action = "speed";
		else if (key == keybinds.loop) action = "loop";
		else if (key == keybinds.randomSong) action = "randomSong";
		else if (key == keybinds.randomPlaylist) action = "randomPlaylist";
		else if (key == keybinds.lastPlaylist) action = "lastPlaylist";
		else if (key == keybinds.pip) action = "pip";

		if (action) {
			event.preventDefault();
			ipcRenderer.send("miniplayer-action", action);
		}
	});

	document.getElementById("previous-button").onclick = () => ipcRenderer.send("miniplayer-previous");
	document.getElementById("pauseplay-button").onclick = () => ipcRenderer.send("miniplayer-playpause");
	document.getElementById("next-button").onclick = () => ipcRenderer.send("miniplayer-next");
	document.getElementById("sound-button").onclick = () => ipcRenderer.send("miniplayer-action", "mute");
	document.getElementById("volume-slider").addEventListener("input", event => {
		currentVolume = Number(event.target.value);
		renderVolumeIcon();
		ipcRenderer.send("miniplayer-volume", { volume: currentVolume });
	});
	document.getElementById("close-button").onclick = () => ipcRenderer.send("miniplayer-close");
	document.getElementById("minimise-button").onclick = () => ipcRenderer.send("miniplayer-minimize");
	document.getElementById("settings-button").onclick = () => setSettingsOpen(!settingsOpen);
	document.getElementById("pip-disable-lyrics").addEventListener("change", event => {
		ipcRenderer.send("miniplayer-lyrics-toggle", { disabled: event.target.checked });
	});
	document.getElementById("pip-translation-select").addEventListener("change", event => {
		ipcRenderer.send("miniplayer-translation", { songId: currentSongId, language: event.target.value });
	});
	document.getElementById("pip-translate-current-only").addEventListener("change", event => {
		translateCurrentOnly = event.target.checked;
		updateTranslationVisibility();
		ipcRenderer.send("miniplayer-translate-current-only", { enabled: translateCurrentOnly });
	});

	const songProgressElement = document.getElementById("song-progress");
	const progressSlider = document.getElementById("pip-progress-slider");

	songProgressElement.addEventListener("mouseenter", () => songProgressElement.classList.add("show-slider"));
	songProgressElement.addEventListener("mouseleave", () => {
		if (!isPipSeeking) songProgressElement.classList.remove("show-slider");
	});

	progressSlider.addEventListener("mousedown", () => {
		isPipSeeking = true;
		ipcRenderer.send("miniplayer-seek", { seeking: true });
	});

	progressSlider.addEventListener("input", () => {
		if (!isPipSeeking) return;
		ipcRenderer.send("miniplayer-seek", { percent: Number(progressSlider.value) });
	});

	window.addEventListener("mouseup", () => {
		if (!isPipSeeking) return;
		isPipSeeking = false;
		ipcRenderer.send("miniplayer-seek", { seeking: false });
	});
</script>
